plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.stockease'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.stockease"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation("com.android.volley:volley:1.2.1")
    implementation 'androidx.cardview:cardview:1.0.0'

}

// StockEase UI design audit — deterministic, dependency-free (tools/ui-check).
// Run: ./gradlew :app:checkStockEaseUi  (fails only on error-severity STOCK findings)
def uiCheckPython = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'py' : 'python3'
tasks.register('checkStockEaseUi', Exec) {
    description = 'Runs StockEase UI audit (STOCK-001..010) and writes baseline reports.'
    group = 'verification'
    workingDir = rootDir
    commandLine uiCheckPython, 'tools/ui-check/check_ui.py',
            '--res', 'app/src/main/res',
            '--config', 'tools/ui-check/ui-check-config.json',
            '--json-out', 'tools/ui-check/baseline-report.json',
            '--md-out', 'tools/ui-check/baseline-report.md'
}